name: Prototype integrity

on:
  push:
    branches: [main]
    paths:
      - 'prototype/**'
      - 'tests/**'
      - 'data/people/**'
      - 'data/places/**'
      - 'index.html'
      - '.github/workflows/prototype-ci.yml'
  pull_request:
    paths:
      - 'prototype/**'
      - 'tests/**'
      - 'data/people/**'
      - 'data/places/**'
      - 'index.html'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prototype:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax
        run: |
          node --check prototype/core.mjs
          node --check prototype/app.mjs
          node --check prototype/openpoi.mjs
          node --check prototype/fate.mjs
          node --check prototype/geography-bridge.mjs
          node --check prototype/map/map-model.mjs
          node --check prototype/map/modern-map.mjs
          node --check prototype/map/agent-observation.mjs
          node --check prototype/map/route-contract.mjs
      - name: Prototype tests
        run: node --test tests/*.test.mjs
      - name: Install lightweight browser driver
        run: npm install --no-save --no-audit --no-fund playwright@1.56.1
      - name: Serve site locally
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/genpei-http.log 2>&1 &
          sleep 1
          curl --fail --silent --show-error http://127.0.0.1:8765/prototype/ > /dev/null
      - name: Headless desktop and mobile-width browser checks
        run: node tests/headless-smoke.mjs
